name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Reproducible build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Supply-chain policy (pinned actions and submodules, exact versions, official registry, no install scripts)
        run: python3 .github/policy.py v3-core-main v3-periphery-main

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.21.1

      - name: Yarn 1.22.22
        run: corepack enable && corepack prepare yarn@1.22.22 --activate

      - name: V3 core (frozen lockfile, no install scripts)
        working-directory: v3-core-main
        run: |
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
          npx --no-install hardhat compile

      - name: V3 periphery (frozen lockfile, no install scripts)
        working-directory: v3-periphery-main
        run: |
          yarn install --frozen-lockfile --ignore-scripts --non-interactive
          npx --no-install hardhat compile

      - name: The build is the code running on LitVM (read-only RPC)
        run: node scripts/verify-deployed.js
